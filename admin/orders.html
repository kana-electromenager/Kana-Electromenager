<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Commandes | KANA Admin</title>


    <!-- =====================================================
         ORDERS CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="orders.css"
    >

</head>


<body>


    <!-- =====================================================
         ADMIN HEADER
    ====================================================== -->

    <header class="admin-header">

        <a
            href="index.html"
            class="admin-logo"
        >

            <img
                src="../images/logo/logo.png"
                alt="KANA Électroménager"
            >

            <div>

                <strong>
                    KANA Électroménager
                </strong>

                <span>
                    Administration
                </span>

            </div>

        </a>


        <a
            href="../index.html"
            class="view-site"
        >
            Voir le site
        </a>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="orders-page">


        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <section class="orders-heading">

            <div>

                <span class="page-kicker">
                    KANA ADMIN
                </span>

                <h1>
                    Commandes
                </h1>

                <p>
                    Gérez les commandes reçues depuis votre boutique.
                </p>

            </div>


            <button
                type="button"
                id="refreshOrders"
                class="refresh-button"
            >
                ACTUALISER
            </button>

        </section>



        <!-- =================================================
             ORDER STATISTICS
             
             IMPORTANT:
             These cards are clickable.
             
             TOTAL       → all
             NOUVELLES   → Nouvelle
             CONFIRMÉES  → Confirmée
             LIVRÉES     → Livrée
        ================================================== -->

        <section
            class="orders-stats"
            aria-label="Statistiques des commandes"
        >


            <!-- =================================================
                 TOTAL
            ================================================== -->

            <button
                type="button"
                class="stat-card stat-card-filter active"
                data-status="all"
                id="totalCard"
            >

                <span>
                    TOTAL
                </span>

                <strong id="totalOrders">
                    0
                </strong>

            </button>



            <!-- =================================================
                 NOUVELLES
            ================================================== -->

            <button
                type="button"
                class="stat-card stat-card-filter"
                data-status="Nouvelle"
                id="newCard"
            >

                <span>
                    NOUVELLES
                </span>

                <strong id="newOrders">
                    0
                </strong>

            </button>



            <!-- =================================================
                 CONFIRMÉES
            ================================================== -->

            <button
                type="button"
                class="stat-card stat-card-filter"
                data-status="Confirmée"
                id="confirmedCard"
            >

                <span>
                    CONFIRMÉES
                </span>

                <strong id="confirmedOrders">
                    0
                </strong>

            </button>



            <!-- =================================================
                 LIVRÉES
            ================================================== -->

            <button
                type="button"
                class="stat-card stat-card-filter"
                data-status="Livrée"
                id="deliveredCard"
            >

                <span>
                    LIVRÉES
                </span>

                <strong id="deliveredOrders">
                    0
                </strong>

            </button>


        </section>



        <!-- =====================================================
             ORDERS SECTION
        ====================================================== -->

        <section class="orders-section">


          



            


            <!-- =================================================
                 ORDERS CONTAINER
                 
                 orders.js will insert the Firebase orders here.
            ================================================== -->

            <div
                id="ordersContainer"
                class="orders-container"
            >

                <div class="orders-loading">

                    <div class="loading-spinner"></div>

                    <p>
                        Chargement des commandes...
                    </p>

                </div>

            </div>


        </section>


    </main>



   



    <!-- =====================================================
         ORDERS JAVASCRIPT
         
         orders.js imports firebase.js itself.
    ====================================================== -->

    <script
        type="module"
        src="orders.js"
    ></script>


</body>

</html>
