<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | KANA Électroménager</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

</head>


<body class="login-page">


    <main class="login-container">


        <!-- LOGO -->

        <a
            href="../index.html"
            class="login-logo"
        >

            <img
                src="../images/logo/logo.png"
                alt="KANA"
            >

            <div>

                <strong>KANA</strong>

                <span>
                    ÉLECTROMÉNAGER
                </span>

            </div>

        </a>



        <!-- LOGIN BOX -->

        <section class="login-box">


            <div class="login-heading">

                <p>
                    ADMINISTRATION
                </p>

                <h1>
                    Connexion
                </h1>

                <span>
                    Connectez-vous pour accéder à votre espace administrateur.
                </span>

            </div>



            <!-- ERROR -->

            <div
                id="loginError"
                class="login-error"
                hidden
            >
                Nom d'utilisateur ou mot de passe incorrect.
            </div>



            <!-- FORM -->

            <form id="loginForm">


                

                <div class="login-field">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="votre adresse e-mail"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="login-field">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="login-button"
                >
                    SE CONNECTER
                </button>


            </form>



            <!-- BACK -->

            <a
                href="../index.html"
                class="login-back"
            >
                ← Retour au site
            </a>


        </section>



        <!-- FOOTER -->

        <p class="login-copyright">
            © 2026 KANA Électroménager
        </p>


    </main>



    <!-- JAVASCRIPT -->

   <script
      type="module"
       src="../js/admin-login.js"
    ></script>


</body>

</html>
