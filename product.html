
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produit | KANA</title>

    <link
        rel="stylesheet"
        href="css/product.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <a href="index.html" class="brand">

            <img
                src="images/logo/logo.png"
                alt="KANA"
                class="brand-logo"
            >

            <div class="brand-text">

                <strong>KANA Électroménager</strong>

                <span>Chez Amrane</span>

            </div>

        </a>


       


        <a
            href="cart.html"
            class="cart-link"
        >
            PANIER
        </a>

    </header>



    <!-- =====================================================
         PRODUCT MAIN
    ====================================================== -->

    <main class="product-page">


        <!-- =================================================
             BREADCRUMB
        ================================================== -->

        <div class="product-breadcrumb">

            <a href="index.html">
                ACCUEIL
            </a>

            <span>
                /
            </span>

            <a href="products.html">
                PRODUITS
            </a>

            <span>
                /
            </span>

            <strong id="breadcrumbProduct">
                PRODUIT
            </strong>

        </div>



        <!-- =================================================
             PRODUCT CONTENT
        ================================================== -->

        <section class="product-details">


            <!-- =================================================
                 PRODUCT IMAGE
            ================================================== -->

            <div class="product-main-image">

                <img
                    id="productImage"
                    src=""
                    alt="Produit"
                >

            </div>



            <!-- =================================================
                 PRODUCT INFORMATION
            ================================================== -->

            <div class="product-details-info">


                <!-- BRAND -->

                <span
                    id="productBrand"
                    class="product-brand-name"
                >
                    KANA
                </span>


                <!-- PRODUCT NAME -->

                <h1 id="productName">
                    Produit
                </h1>


                <!-- DESCRIPTION -->

                <p
                    id="productDescription"
                    class="product-description"
                >
                    Découvrez notre produit.
                </p>



                <!-- =================================================
                     PRICE
                ================================================== -->

                <div
                    id="productPrice"
                    class="product-detail-price"
                >
                    Prix sur demande
                </div>



                <!-- =================================================
                     INSTALLMENT PAYMENT
                ================================================== -->

                <div class="installment-box">


                    <!-- LABEL -->

                    <span class="installment-label">
                        FACILITÉ DE PAIEMENT
                    </span>



                    <!-- OPTIONS -->

                    <div class="installment-options">


                        <button
                            type="button"
                            data-months="3"
                        >
                            3 MOIS
                        </button>


                        <button
                            type="button"
                            data-months="6"
                        >
                            6 MOIS
                        </button>


                        <button
                            type="button"
                            data-months="9"
                        >
                            9 MOIS
                        </button>


                        <button
                            type="button"
                            data-months="12"
                        >
                            12 MOIS
                        </button>


                        <button
                            type="button"
                            data-months="24"
                        >
                            24 MOIS
                        </button>

                    </div>



                    <!-- =================================================
                         INSTALLMENT RESULT
                    ================================================== -->

                    <div class="installment-result">

                        <span>
                            Mensualité
                        </span>

                        <strong id="installmentPrice">
                            —
                        </strong>

                    </div>


                </div>



                <!-- =================================================
                     SEPARATOR
                ================================================== -->

                <div class="product-separator"></div>



                <!-- =================================================
                     AVAILABILITY
                ================================================== -->

                <div class="product-information">

                    <div class="product-information-row">

                        <span>
                            Disponibilité
                        </span>

                        <strong id="productAvailability">
                            Disponible
                        </strong>

                    </div>

                </div>



                <!-- =================================================
                     ACTIONS
                ================================================== -->

                <div class="product-actions">


                    <!-- WHATSAPP -->

                    <a
                        id="whatsappProduct"
                        href="#"
                        class="product-whatsapp"
                        target="_blank"
                        rel="noopener"
                    >
                        CONTACTER SUR WHATSAPP
                    </a>



                    <!-- ADD TO CART -->

                    <button
                        id="addToCartProduct"
                        class="product-cart"
                        type="button"
                    >
                        AJOUTER AU PANIER
                    </button>



                    <!-- ORDER -->

                    <a
                        id="orderProduct"
                        href="#"
                        class="product-order"
                    >
                        COMMANDER
                    </a>


                </div>


            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">


        <!-- =================================================
             FOOTER BRAND
        ================================================== -->

        <div class="footer-brand">

            <img
                src="images/logo/logo.png"
                alt="KANA"
            >

            <div>

                <strong>
                    KANA Électroménager
                </strong>

                <span class="tagline">
                    Chez Amrane
                </span>

            </div>

        </div>

        <!-- =================================================
             FOOTER BOTTOM
        ================================================== -->

        <div class="footer-bottom">

            <p class="footer-copy">
                © 2026 KANA AMRANE Électroménager
            </p>

            

        </div>


    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

   <script type="module" src="js/product.js"></script>


</body>

</html>
